name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish to which PyPI?"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      dry_run:
        description: "Dry run (build only, don't publish)"
        required: false
        type: boolean
        default: false

jobs:
  check-version:
    name: Check version not already published
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version against PyPI
        if: inputs.target == 'pypi'
        run: |
          VERSION=$(python -c "exec(open('feloopy/_version.py').read()); print(__version__)")
          echo "Version to publish: $VERSION"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/feloopy/$VERSION/json")
          if [ "$STATUS" -eq 200 ]; then
            echo "::error::Version $VERSION already exists on PyPI. Bump the version in feloopy/_version.py."
            exit 1
          elif [ "$STATUS" -ne 404 ]; then
            echo "::error::Failed to check PyPI (HTTP $STATUS). Try again later."
            exit 1
          fi
          echo "Version $VERSION is available on PyPI"

      - name: Check version against TestPyPI
        if: inputs.target == 'testpypi'
        run: |
          VERSION=$(python -c "exec(open('feloopy/_version.py').read()); print(__version__)")
          echo "Version to publish: $VERSION"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://test.pypi.org/pypi/feloopy/$VERSION/json")
          if [ "$STATUS" -eq 200 ]; then
            echo "::error::Version $VERSION already exists on TestPyPI. Bump the version in feloopy/_version.py."
            exit 1
          elif [ "$STATUS" -ne 404 ]; then
            echo "::error::Failed to check TestPyPI (HTTP $STATUS). Try again later."
            exit 1
          fi
          echo "Version $VERSION is available on TestPyPI"

  build:
    name: Build distribution
    needs: check-version
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify tests not in wheel
        run: |
          whl=$(find dist -name "*.whl" | head -n 1)
          python -c "
          import zipfile, sys
          z = zipfile.ZipFile('$whl')
          if any('tests/' in n for n in z.namelist()):
              print('ERROR: tests/ found in wheel')
              sys.exit(1)
          print('OK: tests/ not in wheel')
          "

      - name: Verify package installs and imports
        run: |
          pip install dist/*.whl
          python -c "import feloopy; print(f'feloopy {feloopy.__version__} OK')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: inputs.target == 'testpypi' && inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/feloopy
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: inputs.target == 'pypi' && inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/feloopy
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
