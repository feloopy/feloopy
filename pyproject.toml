[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feloopy"
dynamic = ["version"]
description = "FelooPy: Efficient and feature-rich integrated decision environment"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Keivan Tafakkori", email = "k.tafakkori@gmail.com" },
]
maintainers = [
    { name = "Keivan Tafakkori", email = "k.tafakkori@gmail.com" },
]
keywords = [
    "computer science",
    "data science",
    "decision making",
    "decision science",
    "industrial engineering",
    "machine learning",
    "management science",
    "mathematical modeling",
    "operations management",
    "operations research",
    "optimization",
    "simulation",
    "supply chain",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "highspy",
    "infix",
    "matplotlib",
    "nbformat",
    "numpy",
    "openpyxl",
    "pandas",
    "psutil",
    "py-cpuinfo",
    "tabulate",
    "win-unicode-console",
    "xlsxwriter",
    "tqdm",
    "colorama",
    "joblib",
    "rich",
]

[project.urls]
Homepage = "https://feloopy.github.io/"
Repository = "https://github.com/feloopy/feloopy"
Releases = "https://github.com/feloopy/feloopy/releases"

[project.scripts]
feloopy = "feloopy.cli:main"
flp = "feloopy.cli:main"
fly = "feloopy.cli:main"

