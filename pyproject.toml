[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feloopy"
dynamic = ["version"]
description = "FelooPy: Efficient and feature-rich integrated decision environment"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Keivan Tafakkori", email = "k.tafakkori@gmail.com" },
]
maintainers = [
    { name = "Keivan Tafakkori", email = "k.tafakkori@gmail.com" },
]
keywords = [
    "computer science",
    "data science",
    "decision making",
    "decision science",
    "industrial engineering",
    "machine learning",
    "management science",
    "mathematical modeling",
    "operations management",
    "operations research",
    "optimization",
    "simulation",
    "supply chain",
    "heuristics",
    "meta-heuristics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "colorama",
    "infix",
    "matplotlib",
    "nbformat",
    "numpy",
    "openpyxl",
    "packaging",
    "polars[excel]",
    "psutil",
    "py-cpuinfo",
    "rich",
    "scipy",
    "sympy",
    "tabulate",
    "tqdm",
]

[project.urls]
Homepage = "https://feloopy.github.io/"
Repository = "https://github.com/feloopy/feloopy"
Releases = "https://github.com/feloopy/feloopy/releases"

[project.scripts]
feloopy = "feloopy.cli:main"
flp = "feloopy.cli:main"
fly = "feloopy.cli:main"

[project.optional-dependencies]
stock = [
    "pyomo==6.10.1",
    "highspy==1.15.1",
    "pyscipopt==6.2.1",
    "unopy==0.4.14",
    "pydecision==5.1.1",
    "mealpy==3.0.1",
    "pymoo==0.6.1.3",
    "ortools==9.15.6755",
    "cvxpy==1.6.4",
]

[tool.hatch.version]
path = "feloopy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["feloopy"]
exclude = ["tests/**"]
